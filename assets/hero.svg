<svg width="100%" height="100%" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0E" />
      <stop offset="50%" stop-color="#121216" />
      <stop offset="100%" stop-color="#0B0B0E" />
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECC66D" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F7DF94" />
    </linearGradient>

    <linearGradient id="gold-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0" />
      <stop offset="20%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFF2B2" stop-opacity="1" />
      <stop offset="80%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glow-gold" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.07" />
      <circle cx="0" cy="0" r="1" fill="#D4AF37" fill-opacity="0.15" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, "Roboto Mono", "Courier New", monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    @keyframes scanline {
      0% { transform: translateY(-20px); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: translateY(240px); opacity: 0; }
    }
    @keyframes traceGlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes beacon {
      0%, 100% { r: 3.5; opacity: 1; }
      50% { r: 6.5; opacity: 0.4; }
    }

    .pulse-elem { animation: pulseGlow 4s ease-in-out infinite; }
    .trace-anim { stroke-dasharray: 200; animation: traceGlow 6s linear infinite; }
    .beacon-core { animation: beacon 2.5s ease-in-out infinite; }
  </style>

  <!-- Base Card -->
  <rect width="900" height="240" rx="16" fill="url(#bg-grad)" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.35" />
  
  <!-- Subtle Radial Glow in Center -->
  <rect width="900" height="240" rx="16" fill="url(#glow-gold)" />

  <!-- Technical Grid Background -->
  <rect x="1" y="1" width="898" height="238" rx="15" fill="url(#tech-grid)" />

  <!-- Corner Precision Crosshairs -->
  <g stroke="#D4AF37" stroke-width="1" stroke-opacity="0.4">
    <path d="M 24 16 L 24 32 M 16 24 L 32 24" />
    <path d="M 876 16 L 876 32 M 868 24 L 884 24" />
    <path d="M 24 208 L 24 224 M 16 216 L 32 216" />
    <path d="M 876 208 L 876 224 M 868 216 L 884 216" />
  </g>

  <!-- Architectural Circuit Trace Accent (Left) -->
  <g fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.3">
    <path d="M 45 120 L 95 120 L 125 150 L 165 150" class="trace-anim" />
    <circle cx="45" cy="120" r="3" fill="#D4AF37" fill-opacity="0.5" />
    <circle cx="165" cy="150" r="2.5" fill="#D4AF37" fill-opacity="0.8" />
  </g>

  <!-- Architectural Circuit Trace Accent (Right) -->
  <g fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.3">
    <path d="M 855 120 L 805 120 L 775 90 L 735 90" class="trace-anim" />
    <circle cx="855" cy="120" r="3" fill="#D4AF37" fill-opacity="0.5" />
    <circle cx="735" cy="90" r="2.5" fill="#D4AF37" fill-opacity="0.8" />
  </g>

  <!-- Top Status Badge -->
  <g transform="translate(450, 42)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#18181F" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.4" />
    <!-- Pulsing Green Beacon -->
    <circle cx="-114" cy="0" r="5" fill="#22C55E" fill-opacity="0.25" class="beacon-core" />
    <circle cx="-114" cy="0" r="3" fill="#22C55E" />
    <text x="-98" y="4" class="font-mono" font-size="11" fill="#D4AF37" letter-spacing="1.5" font-weight="600">SYSTEM ARCHITECT // ONLINE</text>
  </g>

  <!-- Main Identity Header -->
  <text x="450" y="112" text-anchor="middle" class="font-sans" font-size="34" font-weight="800" fill="url(#gold-grad)" letter-spacing="2.5" filter="url(#glow)">
    ABDULGHANI AL-SHIBAMI
  </text>

  <!-- Arabic Submark & Bilingual Balance -->
  <text x="450" y="142" text-anchor="middle" class="font-sans" font-size="15" font-weight="500" fill="#E8D5A0" letter-spacing="1">
    عبدالغني الشبامي • COMPUTER SYSTEMS ENGINEER
  </text>

  <!-- Roles / Domains Pills Line -->
  <g transform="translate(450, 178)" class="font-mono" font-size="12" text-anchor="middle">
    <!-- Center Dot Separators -->
    <text x="0" y="0" fill="#9E9EAA" font-weight="500" letter-spacing="1">
      <tspan fill="#D4AF37">HIGH-RELIABILITY SYSTEMS</tspan>
      <tspan fill="#D4AF37" fill-opacity="0.4">  |  </tspan>
      <tspan fill="#F7DF94">AI AGENTS &amp; ALGORITHMS</tspan>
      <tspan fill="#D4AF37" fill-opacity="0.4">  |  </tspan>
      <tspan fill="#D4AF37">FULL-STACK CLOUD</tspan>
    </text>
  </g>

  <!-- Bottom Glowing Edge -->
  <line x1="80" y1="239" x2="820" y2="239" stroke="url(#gold-line)" stroke-width="1.8" />
</svg>