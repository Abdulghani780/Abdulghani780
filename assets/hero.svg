<svg width="100%" height="100%" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="burgundy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <!-- Subtle Radial Accent -->
    <radialGradient id="wine-radial" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#190B12" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="ivory-rose-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F0F3" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E5B5C7" />
    </linearGradient>

    <linearGradient id="rose-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0" />
      <stop offset="25%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#E5B5C7" stop-opacity="1" />
      <stop offset="75%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0" />
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="burgundy-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#C77B9B" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="0" cy="0" r="0.8" fill="#C77B9B" fill-opacity="0.2" />
    </pattern>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, "Roboto Mono", "Courier New", monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    @keyframes pulseDot {
      0%, 100% { r: 3; opacity: 0.5; }
      50% { r: 5; opacity: 1; }
    }
    @keyframes drawPath {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes rotateOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .anim-pulse { animation: pulseDot 3s ease-in-out infinite; }
    .anim-path { stroke-dasharray: 300; animation: drawPath 8s linear infinite; }
    .anim-orbit { transform-origin: 450px 130px; animation: rotateOrbit 25s linear infinite; }
  </style>

  <!-- Base Card -->
  <rect width="900" height="260" rx="14" fill="url(#burgundy-bg)" stroke="#701A3D" stroke-width="1.2" stroke-opacity="0.4" />
  <rect width="900" height="260" rx="14" fill="url(#wine-radial)" />
  <rect x="1" y="1" width="898" height="258" rx="13" fill="url(#burgundy-grid)" />

  <!-- Corner Precision Crosshairs -->
  <g stroke="#C77B9B" stroke-width="1" stroke-opacity="0.35">
    <path d="M 24 16 L 24 32 M 16 24 L 32 24" />
    <path d="M 876 16 L 876 32 M 868 24 L 884 24" />
    <path d="M 24 228 L 24 244 M 16 236 L 32 236" />
    <path d="M 876 228 L 876 244 M 868 236 L 884 236" />
  </g>

  <!-- Restrained Orbital Geometry in Center Background -->
  <g class="anim-orbit" fill="none" stroke="#701A3D" stroke-width="0.8" stroke-opacity="0.35">
    <ellipse cx="450" cy="130" rx="280" ry="85" stroke-dasharray="8 6" />
    <ellipse cx="450" cy="130" rx="180" ry="55" stroke-dasharray="4 8" stroke="#C77B9B" stroke-opacity="0.2" />
  </g>

  <!-- Animated Technical Trace Paths (Left & Right) -->
  <g fill="none" stroke="#C77B9B" stroke-width="1.2" stroke-opacity="0.3">
    <path d="M 50 130 L 110 130 L 140 160 L 200 160" class="anim-path" />
    <circle cx="50" cy="130" r="2.5" fill="#C77B9B" fill-opacity="0.6" />
    <circle cx="200" cy="160" r="2" fill="#E5B5C7" />

    <path d="M 850 130 L 790 130 L 760 100 L 700 100" class="anim-path" />
    <circle cx="850" cy="130" r="2.5" fill="#C77B9B" fill-opacity="0.6" />
    <circle cx="700" cy="100" r="2" fill="#E5B5C7" />
  </g>

  <!-- Top Pill Badge -->
  <g transform="translate(450, 46)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#190B12" stroke="#701A3D" stroke-width="0.8" stroke-opacity="0.7" />
    <circle cx="-114" cy="0" r="3.5" fill="#C77B9B" class="anim-pulse" />
    <text x="-98" y="4" class="font-mono" font-size="11" fill="#E5B5C7" letter-spacing="1.5" font-weight="600">SYSTEM ARCHITECT // ACTIVE</text>
  </g>

  <!-- Main Name Header -->
  <text x="450" y="118" text-anchor="middle" class="font-sans" font-size="33" font-weight="800" fill="url(#ivory-rose-grad)" letter-spacing="3" filter="url(#soft-glow)">
    ABDULGHANI AL-SHIBAMI
  </text>

  <!-- Arabic Submark -->
  <text x="450" y="148" text-anchor="middle" class="font-sans" font-size="15" font-weight="500" fill="#E5B5C7" letter-spacing="1">
    عبدالغني الشبامي • COMPUTER SYSTEMS ENGINEER
  </text>

  <!-- Domains Line -->
  <g transform="translate(450, 186)" class="font-mono" font-size="12" text-anchor="middle">
    <text x="0" y="0" fill="#C77B9B" font-weight="500" letter-spacing="1">
      <tspan fill="#F8F0F3">ENTERPRISE SYSTEMS</tspan>
      <tspan fill="#701A3D">  &bull;  </tspan>
      <tspan fill="#E5B5C7">AI &amp; ALGORITHMS</tspan>
      <tspan fill="#701A3D">  &bull;  </tspan>
      <tspan fill="#F8F0F3">FULL-STACK CLOUD</tspan>
    </text>
  </g>

  <!-- Glowing Underline Accent -->
  <line x1="80" y1="259" x2="820" y2="259" stroke="url(#rose-line)" stroke-width="1.6" />
</svg>
