<svg width="100%" height="100%" viewBox="0 0 900 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0B0E" stop-opacity="0" />
      <stop offset="20%" stop-color="#121216" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#121216" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B0B0E" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="footer-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0" />
      <stop offset="30%" stop-color="#D4AF37" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#FFF2B2" stop-opacity="1" />
      <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, "Roboto Mono", monospace; }
  </style>

  <!-- Top accent line -->
  <line x1="50" y1="1" x2="850" y2="1" stroke="url(#footer-line)" stroke-width="1.2" />

  <!-- Background bar -->
  <rect x="50" y="2" width="800" height="66" rx="8" fill="url(#footer-bg)" />

  <!-- Center text -->
  <text x="450" y="32" text-anchor="middle" class="font-mono" font-size="12" fill="#D4AF37" letter-spacing="1.5" font-weight="600">
    ENGINEERED WITH PRECISION • ARCHITECTED FOR SCALE
  </text>
  <text x="450" y="52" text-anchor="middle" class="font-mono" font-size="10.5" fill="#888896" letter-spacing="1">
    © 2026 ABDULGHANI AL-SHIBAMI • SANAA, YEMEN
  </text>
</svg>
